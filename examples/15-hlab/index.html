<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Partii example: hlab humanoid</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9fb4c8; color: #fff; font: 14px system-ui, sans-serif; }
      canvas { display: block; touch-action: none; }
      #status { position: fixed; left: 12px; bottom: 12px; padding: 6px 10px; border-radius: 6px; background: rgba(18, 10, 31, 0.7); }
    </style>
    <!-- The ONE place the versions live. three and hlab load in the browser, not through Vite:
         hlab imports "three" itself, so the page and hlab must share this one three (0.170.0).
         hlab is a release candidate served from Partii staging; for production, change this
         "hlab" line only. test/hlab.test.ts checks every entry is pinned to an exact version. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
          "hlab": "https://api-staging.partii.games/_partii/hlab/1.0.0-rc7.1/hlab.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="status">Loading the humanoid…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
